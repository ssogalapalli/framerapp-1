{% extends 'base.html' %}

{% block title %}Edit Record | Tractor Mitra{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Edit Record</h1>
  <p>Update the selected work record and payment status.</p>
</section>

{% if error %}
  <div class="alert">{{ error }}</div>
{% endif %}

<div class="form-shell">
  <form method="post" class="detail-form">
    <div class="form-grid">
      <label>
        <span>Customer</span>
        <input type="text" name="customer" value="{{ record.customer }}" required />
      </label>

      <label>
        <span>Tractor</span>
        <input type="text" name="tractor" value="{{ record.tractor }}" required />
      </label>

      <label>
        <span>Activity</span>
        <input type="text" name="activity" value="{{ record.activity }}" required />
      </label>

      <label>
        <span>Amount</span>
        <input type="number" step="0.01" name="amount" value="{{ '%.2f'|format(record.amount) }}" required />
      </label>
    </div>

    <label>
      <span>Notes</span>
      <textarea name="notes" rows="4">{{ record.notes }}</textarea>
    </label>

    <div class="cta-row">
      <button type="submit" class="primary-btn">Save Changes</button>
      <a href="{{ url_for('records') }}" class="secondary-btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
