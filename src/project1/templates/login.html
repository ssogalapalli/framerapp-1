{% extends 'base.html' %}

{% block title %}Login | Tractor Mitra{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Login</h1>
  <p>Access your personal farm records.</p>
</section>

<div class="form-shell">
  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}

  <form method="post" class="detail-form">
    <label>
      <span>Username</span>
      <input type="text" name="username" required />
    </label>

    <label>
      <span>Password</span>
      <input type="password" name="password" required />
    </label>

    <button type="submit" class="primary-btn full-width">Login</button>
    <p class="auth-link">
      New here?
      <a href="{{ url_for('signup') }}">Create an account</a>
    </p>
  </form>
</div>
{% endblock %}
